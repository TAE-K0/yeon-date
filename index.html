<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffe9ef"><title>긴급 데이트 요청 🐶</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#332b34}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 20% 10%,#fff 0,#ffe9ef 50%,#ffdce8);display:grid;place-items:center;padding:18px}.app{width:min(100%,440px);background:#fffdfd;border:3px solid #342b34;border-radius:27px;box-shadow:8px 9px 0 #342b34;padding:24px 20px;position:relative;overflow:hidden}.tag{display:inline-block;border:2px solid #342b34;border-radius:100px;background:#ffda69;padding:6px 12px;font-size:12px;font-weight:900;transform:rotate(-4deg)}.dog{font-size:88px;line-height:1.3;display:block;margin:15px auto 0;filter:drop-shadow(3px 5px 0 #ffc8d7);animation:bop 1.6s ease-in-out infinite}.dog.bounce{animation:pop .35s ease-in-out 2}@keyframes bop{50%{transform:translateY(-8px) rotate(-4deg)}}@keyframes pop{50%{transform:scale(1.22) rotate(12deg)}}h1{font-size:clamp(23px,6vw,32px);line-height:1.3;margin:12px 0}p{line-height:1.6}.center{text-align:center}.muted{color:#786b78;font-size:14px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 6px}button,.button{border:2px solid #342b34;border-radius:15px;padding:13px 19px;background:#f3f0f3;font-size:16px;font-weight:900;cursor:pointer;box-shadow:3px 4px 0 #342b34;transition:transform .15s,box-shadow .15s;touch-action:manipulation}button:active{transform:translate(3px,4px);box-shadow:none}.pink{background:#ff83ae}.yellow{background:#ffe07b}.selected{background:#ff83ae!important}.full{width:100%}.hidden{display:none!important}.progress{display:flex;gap:5px;margin:18px 0}.progress span{height:7px;flex:1;border-radius:8px;background:#f0e4e9}.progress .on{background:#ff83ae}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.choices button{padding:15px 8px;font-size:14px;min-height:65px}.field{display:block;width:100%;padding:14px;border:2px solid #342b34;border-radius:13px;font:inherit;background:#fff}.label{display:block;font-weight:800;margin:16px 0 8px}.nav{display:flex;gap:10px;margin-top:20px}.nav button{flex:1}.ticket{border:2px dashed #342b34;border-radius:15px;padding:16px;background:#fff3c9;text-align:left;line-height:1.9}.tiny{font-size:12px;color:#736976}.confetti{position:fixed;pointer-events:none;font-size:25px;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(100vh) rotate(560deg);opacity:0}}@media(max-width:350px){.app{padding:18px 12px}.dog{font-size:70px}}
 .dogpic{display:block;width:min(100%,260px);height:205px;object-fit:contain;margin:14px auto 0;border-radius:18px;animation:bop 1.6s ease-in-out infinite}.dogpic.bounce{animation:pop .35s ease-in-out 2}.credit{font-size:10px;color:#988795;text-align:center;margin-top:2px} .couple-photo{display:none;width:100%;max-height:340px;object-fit:contain;border-radius:16px;margin:14px auto 6px;background:#fff0f5}.couple-photo.visible{display:block}.end-gif-label{display:none;font-size:12px;color:#988795;margin-top:12px}.end-gif-label.visible{display:block}</style></head><body><main class="app"><span class="tag">💌 비상! 데이트 요청 도착</span><div class="progress" id="progress"></div><div class="center"><img class="couple-photo" id="couplePhoto" src="couple.jpg" alt="우리의 추억 사진"><span class="end-gif-label" id="endGifLabel">그리고 축하하는 강아지 🐶👍</span><img class="dogpic" id="dogpic" alt="귀여운 강아지 반응 GIF"><span class="dog hidden" id="dog" role="img" aria-label="강아지">🐶</span><div class="credit">강아지 GIF · GIPHY</div><h1 id="title">연아, 나랑 데이트할래? 🥺</h1><p id="subtitle" class="muted">거절은 가능하지만 강아지가 서운해함</p></div><section id="start"><div class="actions"><button class="pink" id="yes">웅 ㅋㅋ 💗</button><button id="no">시른뎅</button></div></section><section id="form" class="hidden"><div id="fields"></div><div class="nav"><button id="prev">← 이전</button><button class="pink" id="next">다음 →</button></div></section><section id="end" class="hidden"><div class="ticket" id="ticket"></div><div class="actions"><button class="pink full" id="share">💌 결과 공유하기</button><button class="yellow full" id="again">처음부터 다시</button></div><p class="tiny center">선택 내용은 이 기기에만 있어요. 공유 버튼으로 직접 보내주세요!</p></section></main><script>
const $=s=>document.querySelector(s);let step=0,noCount=0;const data={date:'',time:'18:00',food:'',activity:'',note:''};const steps=[{title:'연아, 우리 언제 만날까? 📅',sub:'데이트 날짜부터 잡아보자',dog:'🐕'},{title:'몇 시가 좋아? ⏰',sub:'늦잠은 봐드립니다',dog:'🐶'},{title:'연아, 뭐 먹고 싶어? 🍽️',sub:'메뉴 선정은 중대사항임',dog:'🐕‍🦺',key:'food',items:['🍝 파스타','🍣 초밥','🥩 고기','🍲 한식','🍕 피자','🎲 아무거나']},{title:'밥 먹고 머할까? 🎡',sub:'데이트 2차전',dog:'🐶',key:'activity',items:['☕ 카페','🎬 영화','🌷 산책','📸 사진 찍기','🎮 놀거리','🎁 너가 정해줘']},{title:'마지막으로 한마디 💬',sub:'하고 싶은 말 있으면 적어줘',dog:'🐕'}];function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const gifs={start:'0WWHx07XZxWAbwvSya',confused:'MP4MWhVddBBMYBzXFq',sad:'9VUoaTAg6V4tOToUdx',thumb:'KeGvH598ToGSHNMUoz',yes:'I5toWgcQIfYpBtXK10',party:'3oEjI7KQdaKNLpH79u'};function showGif(mood){const img=$('#dogpic');img.onerror=()=>{img.classList.add('hidden');$('#dog').classList.remove('hidden')};img.classList.remove('hidden');$('#dog').classList.add('hidden');img.src=`https://media.giphy.com/media/${gifs[mood]||gifs.start}/giphy.gif`;img.classList.remove('bounce');void img.offsetWidth;img.classList.add('bounce')}function dog(s){$('#dog').textContent=s;$('#dog').classList.remove('bounce');void $('#dog').offsetWidth;$('#dog').classList.add('bounce')}function progress(n){$('#progress').innerHTML=Array.from({length:6},(_,i)=>`<span class="${i<=n?'on':''}"></span>`).join('')}function render(){document.querySelector('#couplePhoto').classList.remove('visible');document.querySelector('#endGifLabel').classList.remove('visible');progress(step);$('#start').classList.add('hidden');$('#end').classList.add('hidden');$('#form').classList.remove('hidden');let s=steps[step-1];$('#title').textContent=s.title;$('#subtitle').textContent=s.sub;dog(s.dog);showGif(step===3?'confused':step===4?'yes':'start');let html='';if(step===1)html=`<label class="label" for="date">데이트 날짜</label><input class="field" type="date" id="date" value="${safe(data.date)}" min="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}">`;if(step===2)html=`<label class="label" for="time">데이트 시간</label><input class="field" type="time" id="time" value="${safe(data.time)}">`;if(step===3||step===4)html=`<div class="choices">${s.items.map(item=>`<button type="button" class="${data[s.key]===item?'selected':''}" data-choice="${safe(item)}">${safe(item)}</button>`).join('')}</div>`;if(step===5)html=`<label class="label" for="note">메시지 (선택)</label><textarea class="field" id="note" rows="4" maxlength="200" placeholder="예: 맛있는 거 먹고 재밌게 놀자 ㅋㅋ">${safe(data.note)}</textarea>`;$('#fields').innerHTML=html;$('#fields').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{data[s.key]=b.dataset.choice;renderChoices(s.key)});$('#next').textContent=step===5?'데이트 확정 💗':'다음 →'}function renderChoices(key){document.querySelectorAll('[data-choice]').forEach(b=>b.classList.toggle('selected',b.dataset.choice===data[key]))}function save(){if(step===1)data.date=$('#date').value;if(step===2)data.time=$('#time').value;if(step===5)data.note=$('#note').value}function celebrate(){for(let i=0;i<28;i++){let el=document.createElement('span');el.className='confetti';el.textContent=['💗','✨','🐾','💕'][i%4];el.style.left=Math.random()*100+'vw';el.style.top='-40px';el.style.animationDelay=Math.random()*.8+'s';document.body.append(el);setTimeout(()=>el.remove(),2600)}}function result(){document.querySelector('#couplePhoto').classList.add('visible');document.querySelector('#endGifLabel').classList.add('visible');progress(5);$('#form').classList.add('hidden');$('#end').classList.remove('hidden');$('#title').textContent='연이랑 데이트 확정!! 💗';$('#subtitle').textContent='강아지가 매우 만족하셨습니다';dog('🐶👍');showGif('thumb');$('#ticket').innerHTML=`<strong>💌 연이랑 우리의 데이트 티켓</strong><br>📅 날짜: ${safe(data.date)}<br>⏰ 시간: ${safe(data.time)}<br>🍽️ 음식: ${safe(data.food)}<br>🎡 코스: ${safe(data.activity)}${data.note?'<br>💬 한마디: '+safe(data.note):''}`;celebrate()}$('#no').onclick=()=>{noCount++;const lines=['아니 왜 눌러 ㅠㅠ','한 번만 다시 생각해봐','강아지 지금 눈물 참는 중','이쯤 되면 장난이지?','알겠어... 그래도 기다릴게 🥹'];$('#subtitle').textContent=lines[Math.min(noCount-1,lines.length-1)];dog(['🥺','🐶','😭','🐕','🥹'][Math.min(noCount-1,4)]);showGif(noCount===1?'confused':noCount===2?'sad':noCount===3?'confused':'sad');$('#yes').style.fontSize=Math.min(16+noCount*2,27)+'px';$('#yes').style.padding=`${Math.min(13+noCount*2,23)}px 19px`};$('#yes').onclick=()=>{step=1;render()};$('#prev').onclick=()=>{save();if(step===1){step=0;$('#form').classList.add('hidden');$('#start').classList.remove('hidden');$('#title').textContent='연아, 나랑 데이트할래? 🥺';$('#subtitle').textContent='거절은 가능하지만 강아지가 서운해함';dog('🐶');showGif('start');progress(0)}else{step--;render()}};$('#next').onclick=()=>{save();if(step===1&&!data.date){alert('날짜를 골라줘 🐶');return}if(step===2&&!data.time){alert('시간을 골라줘 🐶');return}if(step===3&&!data.food||step===4&&!data.activity){alert('하나 골라줘 🐶');return}if(step===5)result();else{step++;render()}};function message(){return `🐶 연이랑 데이트 확정!\n📅 ${data.date}\n⏰ ${data.time}\n🍽️ ${data.food}\n🎡 ${data.activity}${data.note?'\n💬 '+data.note:''}`}$('#share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'우리 데이트 티켓 💗',text:message()});else if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(message());alert('복사 완료! 카톡으로 보내줘 💌')}else{let t=document.createElement('textarea');t.value=message();document.body.append(t);t.select();document.execCommand('copy');t.remove();alert('복사 완료! 카톡으로 보내줘 💌')}}catch(e){if(e.name!=='AbortError')alert('공유가 안 되면 화면을 캡처해서 보내줘!')}};$('#again').onclick=()=>location.reload();progress(0);showGif('start');
</script></body></html>
